# Hyphae v2 Docker Compose stack: hyphae-node + Caddy auto-TLS (zero-buffering SSE)
#
# Quick start:
#   1. Generate a hardened node.json and Caddyfile:
#        hyp-rs deploy init docker --node-id acme-team --domain mesh.example.com --out ./deploy-out
#      Or copy deploy/Caddyfile.example -> deploy/Caddyfile and create deploy/node.json
#      (with upstream set to `hyphae-node:8790` in Caddyfile).
#   2. Start the stack from repo root:
#        docker compose -f deploy/docker-compose.yml up -d --build
#   3. Verify anti-recon & TLS health:
#        hyp-rs deploy check --url https://mesh.example.com --config ./deploy/node.json

services:
  hyphae-node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hyphae-node
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32M,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HYPHAE_SECRET_BACKEND: file
      HYPHAE_STATE_DIR: /var/lib/hyphae
      HYPHAE_CONFIG: /etc/hyphae/node.json
    volumes:
      - ./node.json:/etc/hyphae/node.json:ro
      - hyphae_state:/var/lib/hyphae
    # Intentionally NOT publishing 8790 on the host — only Caddy talks to hyphae-node
    # over the isolated internal bridge network.
    networks:
      - hyphae_internal

  caddy:
    image: caddy:2-alpine
    container_name: hyphae-caddy
    restart: unless-stopped
    depends_on:
      - hyphae-node
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hyphae_internal

networks:
  hyphae_internal:
    driver: bridge

volumes:
  hyphae_state:
  caddy_data:
  caddy_config:
