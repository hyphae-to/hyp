[workspace]
resolver = "3"
members = [
  "crates/hyp-mycelium",
  "crates/hyp-proto",
  "crates/hyp-crypto",
  "crates/hyp-store",
  "crates/hyp-node",
  "crates/hyp-pairing-client",
  "crates/hyp-harness",
  "crates/hyp-harness/daemon",
  "crates/hyp-harness/client",
  "crates/hyp-harness/ipc",
  "crates/hyp-harness/plugins",
  "crates/hyp-harness/transport",
  "crates/hyp-cli",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/hyphae-to/hyp"
homepage = "https://hyphae.to"

[workspace.dependencies]
hyp-mycelium = { path = "crates/hyp-mycelium" }
hyp-proto = { path = "crates/hyp-proto" }
hyp-crypto = { path = "crates/hyp-crypto" }
hyp-store = { path = "crates/hyp-store" }
hyp-node = { path = "crates/hyp-node" }
hyp-pairing-client = { path = "crates/hyp-pairing-client" }
hyp-harness = { path = "crates/hyp-harness" }
hyp-daemon = { path = "crates/hyp-harness/daemon" }
hyp-harness-client = { path = "crates/hyp-harness/client" }
hyp-harness-ipc = { path = "crates/hyp-harness/ipc" }
hyp-harness-plugins = { path = "crates/hyp-harness/plugins" }
hyp-harness-transport = { path = "crates/hyp-harness/transport" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
hex = "0.4"
semver = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
ring = "0.17"
sha2 = "0.10"
hmac = "0.12"
pkcs8 = "0.10"
der = "0.7"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "server", "server-auto", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
bytes = "1"
futures-util = "0.3"
regex = "1"
tempfile = "3"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
