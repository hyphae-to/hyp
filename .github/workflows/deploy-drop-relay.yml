name: Deploy Drop Relay (Cloudflare Workers)

on:
  push:
    branches: ["main"]
    paths:
      - "workers/drop-relay/**"
      - ".github/workflows/deploy-drop-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-drop-relay"
  cancel-in-progress: false

jobs:
  test:
    name: Verify Cloudflare Drop Relay Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax-check and run Drop Relay Worker test suite
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check workers/drop-relay/src/index.mjs
          node workers/drop-relay/test/worker.test.mjs

  deploy:
    name: Deploy spore.hyphae.to to Cloudflare Workers
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.repository == 'hyphae-to/hyp')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-drop-relay
      url: https://spore.hyphae.to/v1/health
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: creds
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CF_TOKEN:-}" ] && [ -n "${CF_ACCOUNT:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping spore.hyphae.to deploy: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub repository/environment secrets to enable automatic deployment."
          fi

      - name: Deploy Worker (production env -> spore.hyphae.to)
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/drop-relay
          command: deploy --env production

      - name: Smoke-test GET https://spore.hyphae.to/v1/health
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if out="$(curl -fsS --max-time 10 https://spore.hyphae.to/v1/health)"; then
              echo "$out"
              python3 -c '
import json, sys
j = json.loads(sys.argv[1])
assert j.get("ok") is True and j.get("dropRelay", {}).get("enabled") is True, j
' "$out"
              echo "spore.hyphae.to health check verified."
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: https://spore.hyphae.to/v1/health failed after 5 attempts." >&2
          exit 1
