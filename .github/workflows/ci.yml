name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & Differential Tests
        run: npm test

      - name: Integration Tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Package Tarball Dry-Run
        run: npm pack --dry-run

      - name: Syntax check JS plugins and site script
        run: |
          for f in \
            site/app.js \
            plugins/sdk/client.mjs \
            plugins/slack/index.mjs \
            plugins/telegram/index.mjs \
            plugins/webhook/index.mjs \
            plugins/whatsapp/index.mjs \
            plugins/prometheus/index.mjs; do
            node --check "$f"
          done
