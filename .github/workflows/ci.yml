name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      os:
        description: "Target OS matrix (pick a single OS for fast branch checks without burning full 3-OS minutes)"
        type: choice
        default: all
        options:
          - all
          - windows-latest
          - macos-latest
          - ubuntu-latest
      skip_release_build:
        description: "Skip release binary build & installer checks (fast clippy + workspace tests only)"
        type: boolean
        default: false

      compiler_cache:
        description: "Linux experiment cache policy"
        type: choice
        default: dependencies
        options:
          - dependencies
          - sccache

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.compiler_cache || 'default' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HYPHAE_SECRET_BACKEND: file

jobs:
  detect-changes:
    name: Change Detection
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_rust: ${{ steps.changes.outputs.run_rust }}
      run_js: ${{ steps.changes.outputs.run_js }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths for Rust and JS/TS CI
        id: changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          CHANGED=""
          if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            CHANGED="$(git -c core.quotepath=false diff --name-only HEAD^1 HEAD || true)"
          elif [ -n "${PR_BASE_SHA:-}" ] && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            CHANGED="$(git -c core.quotepath=false diff --name-only "${PR_BASE_SHA}" HEAD || true)"
          fi

          if [ -z "$CHANGED" ]; then
            echo "Unable to determine changed PR files; running Rust and JS CI."
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
            echo "run_js=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_RUST="false"
          RUN_JS="false"
          while IFS= read -r path; do
            [ -z "$path" ] && continue

            case "$path" in
              *.md|LICENSE|docs/*|skills/*|site/index.html|site/styles.css|site/app.js|site/CNAME|site/assets/*|site/join/*|workers/*|itest/*|.github/workflows/pages.yml|.github/workflows/deploy-drop-relay.yml|.oxlintrc.json|package.json|package-lock.json)
                ;;
              *)
                if [ "$RUN_RUST" = "false" ]; then
                  echo "Rust/runtime/plugin/installer/workflow change detected: $path"
                  RUN_RUST="true"
                fi
                ;;
            esac

            case "$path" in
              plugins/*|site/*|workers/*|scripts/*|itest/*|install.sh|uninstall.sh|package.json|package-lock.json|.tool-versions|.oxlintrc.json|.github/workflows/ci.yml|*.js|*.mjs|*.cjs|*.ts|*.tsx|*.py|*.sh|*.ps1)
                if [ "$RUN_JS" = "false" ]; then
                  echo "JS/TS/plugin/site/script/workflow change detected: $path"
                  RUN_JS="true"
                fi
                ;;
            esac
          done <<< "$CHANGED"

          echo "Detected matrix: run_rust=${RUN_RUST}, run_js=${RUN_JS}"
          echo "run_rust=${RUN_RUST}" >> "$GITHUB_OUTPUT"
          echo "run_js=${RUN_JS}" >> "$GITHUB_OUTPUT"

  js-lint-and-tests:
    name: JavaScript / TypeScript (Node 24)
    needs: detect-changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.run_js == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install JS/TS linter (oxlint)
        run: npm ci

      - name: Lint JS/TS (oxlint --deny-warnings)
        run: npm run lint:js

      - name: Run JS/TS unit test suites
        run: npm run test:js

      - name: Run native Claude Code panel tests
        shell: bash
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/hyphae-claude-config
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/hyphae-claude-runtime"
          npm install --prefix "$runtime_dir" --no-audit --no-fund --loglevel=error @anthropic-ai/claude-code@2.1.332
          "$runtime_dir/node_modules/.bin/claude" plugin test "$GITHUB_WORKSPACE/plugins/claude-code"

      - name: Syntax-check JS, Python, shell, PowerShell, and verify raw script parity
        shell: bash
        run: |
          set -euo pipefail
          node --version
          python3 --version

          while IFS= read -r file; do
            node --check "$file"
          done < <(find plugins site workers scripts -type f \( -name '*.mjs' -o -name '*.js' \) | sort)

          while IFS= read -r file; do
            python3 -m py_compile "$file"
          done < <(find plugins -type f -name '*.py' | sort)

          for script in install.sh uninstall.sh scripts/install.sh scripts/uninstall.sh scripts/stage-pages.sh plugins/herdr-mod/scripts/install.sh; do
            sh -n "$script"
          done
          bash -n scripts/test-installer.sh scripts/uninstall.sh scripts/reset-local.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -s sh scripts/install.sh
          fi

          cmp -s scripts/install.sh install.sh
          cmp -s scripts/uninstall.sh uninstall.sh

          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '
              $ErrorActionPreference = "Stop"
              foreach ($path in @("scripts/install.ps1", "scripts/uninstall.ps1")) {
                $tokens = $null
                $errors = $null
                $resolved = (Resolve-Path $path).Path
                [void][System.Management.Automation.Language.Parser]::ParseFile($resolved, [ref]$tokens, [ref]$errors)
                if ($errors -and $errors.Count -gt 0) {
                  $msg = ($errors | ForEach-Object { $_.ToString() }) -join "`n"
                  throw "PowerShell syntax error(s) in ${path}:`n$msg"
                }
              }
            '
          fi
          echo "All JS/TS, Python, shell, PowerShell, and raw script parity checks passed."

  rust-workspace:
    name: Rust (${{ matrix.os }})
    needs: detect-changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.run_rust == 'true')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.os != 'all' && format('["{0}"]', inputs.os) || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.87.0
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: clippy, rustfmt

      - name: Set up Node.js 24 (native plugin & JS interop E2E)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-linux-sccache-control-v1
          save-if: ${{ github.ref == 'refs/heads/experiment/linux-sccache-gha' && github.event_name == 'workflow_dispatch' && inputs.compiler_cache == 'dependencies' }}

      - name: Mask the GitHub Actions cache runtime token
        if: github.ref == 'refs/heads/experiment/linux-sccache-gha' && runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.compiler_cache == 'sccache'
        uses: actions/github-script@v7
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            if (!token) throw new Error('GitHub Actions cache runtime token is missing');
            core.setSecret(token);

      - name: Install pinned sccache
        if: github.ref == 'refs/heads/experiment/linux-sccache-gha' && runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.compiler_cache == 'sccache'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.20.1
          disable_annotations: "true"

      - name: Start sccache with GitHub Actions remote storage
        if: github.ref == 'refs/heads/experiment/linux-sccache-gha' && runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.compiler_cache == 'sccache'
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: "on"
          SCCACHE_GHA_RW_MODE: READ_WRITE
          SCCACHE_GHA_VERSION: hyp-linux-compilation-v1
        run: |
          set -euo pipefail
          test -n "$ACTIONS_RESULTS_URL"
          test -n "$ACTIONS_RUNTIME_TOKEN"
          sccache --version
          sccache --start-server
          sccache --zero-stats
          sccache --show-stats | grep -Ei '^Cache location.*(ghac?|github)'
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Formatting check (rustfmt)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Check CLI renderer boundaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          result=0
          git grep -nE '(^|[^[:alnum:]_])(emit_error|print_command_error)[[:space:]]*\(|(^|[^[:alnum:]_])JsonEnvelope[[:space:]]*\{' -- \
            'crates/hyp-cli/src/*.rs' \
            ':(exclude)crates/hyp-cli/src/main.rs' \
            ':(exclude)crates/hyp-cli/src/ui.rs' || result=$?
          if [[ "$result" -eq 0 ]]; then
            echo "Return CliError to the dispatcher and use a JsonEnvelope builder."
            exit 1
          fi
          if [[ "$result" -gt 1 ]]; then
            exit "$result"
          fi

      - name: Check harness dependency boundaries
        shell: bash
        run: |
          set -euo pipefail
          tree() { cargo tree --locked --edges normal,build --prefix none --format '{p}' -p "$1"; }
          client=$(tree hyp-harness-client)
          daemon=$(tree hyp-daemon)
          if grep -E '^(hyp-daemon|hyp-harness|hyp-harness-transport|hyp-harness-plugins|hyp-node|hyp-store|rusqlite|libsqlite3-sys) v' <<< "$client"; then
            echo "The hook/MCP/wait client pulled in server or storage dependencies."
            exit 1
          fi
          if grep -E '^(hyp-harness|hyp-harness-client|hyp-harness-plugins) v' <<< "$daemon"; then
            echo "The daemon pulled in a client or a consumer of its API."
            exit 1
          fi

          digest=$(tree hyp-delivery-digest)
          view=$(tree hyp-session-view)
          if grep -E '^(hyp-daemon|hyp-harness[^ ]*|hyp-node|tokio) v' <<< "$digest"; then
            echo "The digest renderer depends on a runtime."
            exit 1
          fi
          if grep -E '^(hyp-daemon|hyp-harness[^ ]*|hyp-node|hyp-store|rusqlite|libsqlite3-sys|tokio) v' <<< "$view"; then
            echo "The session view depends on a runtime or storage."
            exit 1
          fi

      - name: Clippy (zero warnings across workspace & all targets)
        run: cargo clippy --workspace --all-targets --keep-going --locked -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-nextest@0.9.152

      - name: Workspace Tests (unit, golden interop, chaos & CLI E2E)
        # The dedicated Linux live plugin step captures output to detect skips.
        run: cargo nextest run --workspace --locked --no-fail-fast ${{ runner.os == 'Linux' && '-E "not binary(=real_plugins_e2e)"' || '' }}

      - name: Workspace doctests
        run: cargo test --workspace --locked --doc

      - name: Verify live Node.js & Python external plugin E2E (zero skips)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          python3 --version
          out="$(cargo nextest run --locked -p hyp-node --test real_plugins_e2e --no-capture --no-fail-fast 2>&1)" || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          if [[ "$out" == *'SKIP '* ]]; then
            echo "ERROR: real_plugins_e2e skipped one or more live plugin tests!" >&2
            exit 1
          fi

      - name: Build release binary (hyp)
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_release_build
        run: cargo build --release --locked -p hyp-cli

      - name: Report sccache stats
        if: always() && github.ref == 'refs/heads/experiment/linux-sccache-gha' && runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.compiler_cache == 'sccache' && env.RUSTC_WRAPPER == 'sccache'
        run: |
          sccache --show-stats
          sccache --show-stats --stats-format json

      - name: Verify bidirectional JS <-> Rust Verified Human Drops interop (H19)
        if: runner.os == 'Linux'
        shell: bash
        env:
          HYPHAE_BIN: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_release_build && './target/debug/hyp' || './target/release/hyp' }}
        run: |
          set -euo pipefail
          node --version
          export HYPHAE_BIN="$PWD/${HYPHAE_BIN#./}"
          test -x "$HYPHAE_BIN"
          node --test site/drop/cross_lang_interop.test.mjs

      - name: Smoke-test compiled binary (Unix)
        if: runner.os != 'Windows' && (github.event_name != 'workflow_dispatch' || !inputs.skip_release_build)
        shell: bash
        run: |
          set -euo pipefail
          out="$(./target/release/hyp version --json)"
          echo "$out"
          python3 -c 'import json, sys; j = json.loads(sys.argv[1]); assert j.get("ok") is True and j.get("command") == "version" and j.get("data", {}).get("version"), j' "$out"

      - name: Run installer E2E verification suite (Unix, reusing built binary)
        if: runner.os != 'Windows' && (github.event_name != 'workflow_dispatch' || !inputs.skip_release_build)
        shell: bash
        env:
          HYPHAE_PREBUILT_BIN: ./target/release/hyp
        run: bash scripts/test-installer.sh

      - name: Smoke-test compiled binary (Windows)
        if: runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || !inputs.skip_release_build)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = & .\target\release\hyp.exe version --json
          Write-Output $out
          $json = $out | ConvertFrom-Json
          if (-not $json.ok -or $json.command -ne "version" -or -not $json.data.version) {
            throw "Unexpected hyp.exe version --json output: $out"
          }

      - name: Verify Windows PowerShell installer & uninstaller (AST, dry-run & isolated uninstall)
        if: runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || !inputs.skip_release_build)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @("scripts/install.ps1", "scripts/uninstall.ps1")) {
            $tokens = $null
            $errors = $null
            $resolved = (Resolve-Path $path).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($resolved, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $msg = ($errors | ForEach-Object { $_.ToString() }) -join "`n"
              throw "PowerShell syntax error(s) in ${path}:`n$msg"
            }
          }
          $dryOut = (& .\scripts\install.ps1 -Version v0.2.0-test -BaseUrl "http://127.0.0.1:1/test" -DryRun) | Out-String
          Write-Output $dryOut
          if ($dryOut -notmatch "hyp-v0\.2\.0-test-x86_64-pc-windows-msvc\.zip") {
            throw "Unexpected Windows installer -DryRun output: $dryOut"
          }
          $tmpRoot = Join-Path ([System.IO.Path]::GetTempPath()) ("hyphae-ps1-ci-" + [System.Guid]::NewGuid().ToString("N"))
          $tmpBin = Join-Path $tmpRoot "bin"
          $tmpState = Join-Path $tmpRoot "state"
          try {
            New-Item -ItemType Directory -Force -Path $tmpBin, $tmpState | Out-Null
            Set-Content -LiteralPath (Join-Path $tmpBin "hyp.exe") -Value "stub" -NoNewline
            Set-Content -LiteralPath (Join-Path $tmpBin "hyp.exe.old") -Value "old" -NoNewline
            Set-Content -LiteralPath (Join-Path $tmpState "node.json") -Value "{}" -NoNewline
            $uDry = (& .\scripts\uninstall.ps1 -DryRun -InstallDir $tmpBin -StateDir $tmpState -KeepHarnesses) | Out-String
            Write-Output $uDry
            if ($uDry -notmatch "\[dry-run\]") {
              throw "Unexpected Windows uninstaller -DryRun output: $uDry"
            }
            if (-not (Test-Path -LiteralPath (Join-Path $tmpBin "hyp.exe")) -or -not (Test-Path -LiteralPath (Join-Path $tmpState "node.json"))) {
              throw "Windows uninstaller -DryRun modified files!"
            }
            $prevEap = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            & pwsh -NoProfile -File .\scripts\uninstall.ps1 -InstallDir $tmpBin -StateDir $tmpState -KeepHarnesses
            $nonInteractiveRc = $LASTEXITCODE
            $ErrorActionPreference = $prevEap
            if ($nonInteractiveRc -ne 2) {
              throw "Expected non-interactive uninstall.ps1 without -Yes to exit 2, got $nonInteractiveRc"
            }
            & pwsh -NoProfile -File .\scripts\uninstall.ps1 -Yes -InstallDir $tmpBin -StateDir $tmpState -KeepHarnesses
            if ($LASTEXITCODE -ne 0) {
              throw "Expected uninstall.ps1 -Yes to exit 0, got $LASTEXITCODE"
            }
            if ((Test-Path -LiteralPath $tmpBin) -or (Test-Path -LiteralPath $tmpState)) {
              throw "Windows uninstaller -Yes failed to remove isolated test targets!"
            }
          } finally {
            if (Test-Path -LiteralPath $tmpRoot) {
              Remove-Item -LiteralPath $tmpRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "PowerShell AST parse, dry-run & isolated uninstall verified."
