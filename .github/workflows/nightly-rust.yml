name: Nightly Rust Binaries

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        required: false
        default: false
        description: "Force nightly build and release update even if main has no new commits since the last nightly release"

permissions:
  contents: read

concurrency:
  group: nightly-rust
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check Main Commits & Resolve Nightly Metadata
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.meta.outputs.should_build }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      git_sha: ${{ steps.meta.outputs.git_sha }}
      published_at: ${{ steps.meta.outputs.published_at }}
      changelog_summary: ${{ steps.meta.outputs.changelog_summary }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Check for new commits since last nightly release
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE_BUILD: ${{ inputs.force == true }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          DATE_STAMP="$(date -u +%Y%m%d)"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          RAW_VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          BASE_VER="${RAW_VER%%-*}"
          BASE_VER="${BASE_VER:-0.2.0}"
          NIGHTLY_VER="${BASE_VER}-nightly.${DATE_STAMP}.${SHORT_SHA}"

          LAST_SHA=""
          if LAST_TAG_JSON="$(gh api "repos/${REPO}/git/ref/tags/nightly" 2>/dev/null || true)"; then
            if [ -n "$LAST_TAG_JSON" ]; then
              LAST_SHA="$(node -e '
                const data = JSON.parse(process.argv[1]);
                process.stdout.write((data.object && data.object.sha) ? String(data.object.sha) : "");
              ' "$LAST_TAG_JSON" 2>/dev/null || true)"
            fi
          fi

          SHOULD_BUILD="true"
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$HEAD_SHA" ] && [ "$FORCE_BUILD" != "true" ]; then
            SHOULD_BUILD="false"
            echo "No new commits on main since last nightly release (${HEAD_SHA}); skipping nightly build."
          else
            echo "Building nightly release ${NIGHTLY_VER} for commit ${HEAD_SHA} (previous nightly: ${LAST_SHA:-none})."
          fi

          SUMMARY="$(git log -1 --pretty=%s | tr '\r\n' ' ' | cut -c1-160)"

          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=nightly" >> "$GITHUB_OUTPUT"
          echo "version=${NIGHTLY_VER}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "published_at=${PUBLISHED_AT}" >> "$GITHUB_OUTPUT"
          echo "changelog_summary=${SUMMARY}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Nightly (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
            smoke_test: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
            smoke_test: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            smoke_test: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive_ext: tar.gz
            musl: true
            smoke_test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive_ext: tar.gz
            smoke_test: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            smoke_test: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.git_sha }}

      - name: Install Rust 1.87.0 (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.target }}

      - name: Install musl-tools (for x86_64-unknown-linux-musl)
        if: matrix.musl == true
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build stripped release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET" -p hyp-cli

      - name: Build stripped release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --locked --target $env:TARGET -p hyp-cli

      - name: Package archive (Unix tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          SMOKE_TEST: ${{ matrix.smoke_test }}
        run: |
          set -euo pipefail
          ARCHIVE="hyp-${TAG}-${TARGET}.tar.gz"
          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT

          cp "target/${TARGET}/release/hyp-rs" "${STAGE}/hyp"
          chmod 0755 "${STAGE}/hyp"

          if [ "$SMOKE_TEST" = "true" ]; then
            "${STAGE}/hyp" version --json
          fi

          mkdir -p dist
          tar -C "$STAGE" -czf "dist/${ARCHIVE}" hyp
          ls -lh "dist/${ARCHIVE}"

      - name: Package archive (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "hyp-$($env:TAG)-$($env:TARGET).zip"
          $stage = Join-Path $env:RUNNER_TEMP "hyp-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $bin = Join-Path $stage "hyp.exe"
          Copy-Item -Path "target\$($env:TARGET)\release\hyp-rs.exe" -Destination $bin -Force
          & $bin version --json

          Compress-Archive -Path $bin -DestinationPath "dist\$archive" -Force
          Get-Item "dist\$archive" | Format-List Name, Length

      - name: Upload nightly target archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.target }}
          path: dist/hyp-*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Generate Checksums, Signed Manifest & Update Rolling Nightly Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all 6 nightly target archives
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS.txt & canonical release-manifest.json
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
          PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
          CHANGELOG_SUMMARY: ${{ needs.prepare.outputs.changelog_summary }}
          REPO: ${{ github.repository }}
          HYPHAE_RELEASE_SIGNING_KEY: ${{ secrets.HYPHAE_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cd dist

          expected=(
            "hyp-${TAG}-aarch64-apple-darwin.tar.gz"
            "hyp-${TAG}-x86_64-apple-darwin.tar.gz"
            "hyp-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "hyp-${TAG}-x86_64-unknown-linux-musl.tar.gz"
            "hyp-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
            "hyp-${TAG}-x86_64-pc-windows-msvc.zip"
          )

          for file in "${expected[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing expected nightly archive: $file" >&2
              exit 1
            fi
          done

          sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

          node <<'EOF'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const tag = process.env.TAG;
          const repo = process.env.REPO;
          const targets = [
            ["aarch64-apple-darwin", "tar.gz"],
            ["aarch64-unknown-linux-gnu", "tar.gz"],
            ["x86_64-apple-darwin", "tar.gz"],
            ["x86_64-pc-windows-msvc", "zip"],
            ["x86_64-unknown-linux-gnu", "tar.gz"],
            ["x86_64-unknown-linux-musl", "tar.gz"],
          ];

          const artifacts = {};
          for (const [triple, ext] of targets) {
            const filename = `hyp-${tag}-${triple}.${ext}`;
            const data = fs.readFileSync(filename);
            const sha256 = crypto.createHash("sha256").update(data).digest("hex");
            artifacts[triple] = {
              sha256,
              size: data.length,
              url: `https://github.com/${repo}/releases/download/${tag}/${filename}`,
            };
          }

          function canonicalize(value) {
            if (value === null || typeof value !== "object") {
              return JSON.stringify(value);
            }
            if (Array.isArray(value)) {
              return "[" + value.map(canonicalize).join(",") + "]";
            }
            const keys = Object.keys(value).sort();
            return "{" + keys.map((k) => JSON.stringify(k) + ":" + canonicalize(value[k])).join(",") + "}";
          }

          const payloadObj = {
            artifacts,
            changelogSummary: process.env.CHANGELOG_SUMMARY || "Automated nightly build from main",
            channel: "nightly",
            gitSha: process.env.GIT_SHA,
            minProtocol: 1,
            publishedAt: process.env.PUBLISHED_AT,
            version: process.env.VERSION,
          };
          const canonicalPayload = canonicalize(payloadObj);

          let sig = "";
          const rawKey = (process.env.HYPHAE_RELEASE_SIGNING_KEY || "").trim();
          if (rawKey) {
            const keyObj = rawKey.includes("BEGIN PRIVATE KEY")
              ? crypto.createPrivateKey(rawKey)
              : crypto.createPrivateKey({
                  key: Buffer.from(rawKey, "base64url"),
                  format: "der",
                  type: "pkcs8",
                });
            const signingInput = Buffer.concat([
              Buffer.from("hyphae/v2/release\n", "utf8"),
              Buffer.from(canonicalPayload, "utf8"),
            ]);
            sig = crypto.sign(null, signingInput, keyObj).toString("base64url");
            console.log("Signed release-manifest.json with HYPHAE_RELEASE_SIGNING_KEY.");
          } else {
            console.log("HYPHAE_RELEASE_SIGNING_KEY secret not configured; writing unsigned manifest envelope.");
          }

          const envelope = { payload: canonicalPayload, sig };
          fs.writeFileSync("release-manifest.json", JSON.stringify(envelope, null, 2) + "\n", "utf8");
          EOF

      - name: Move rolling nightly tag to built commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/nightly" \
              -f sha="${GIT_SHA}" \
              -F force=true >/dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/tags/nightly" \
              -f sha="${GIT_SHA}" >/dev/null
          fi

      - name: Update rolling nightly GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ needs.prepare.outputs.git_sha }}
          name: "Hyphae Nightly (${{ needs.prepare.outputs.version }})"
          body: |
            Rolling nightly Rust build from `main` commit `${{ needs.prepare.outputs.git_sha }}`.

            - **Version:** `${{ needs.prepare.outputs.version }}`
            - **Published:** `${{ needs.prepare.outputs.published_at }}`
            - **Summary:** ${{ needs.prepare.outputs.changelog_summary }}
          prerelease: true
          make_latest: "false"
          files: |
            dist/hyp-*
            dist/SHA256SUMS.txt
            dist/release-manifest.json
