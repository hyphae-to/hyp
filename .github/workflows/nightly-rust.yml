name: Nightly Rust Binaries

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        required: false
        default: false
        description: "Force nightly build and release update even if main has no new commits since the last nightly release"
      dry_run:
        type: boolean
        required: false
        default: false
        description: "Build and package nightly artifacts without moving the rolling nightly tag or updating the GitHub Release"
      allow_unsigned_dry_run:
        type: boolean
        required: false
        default: false
        description: "Allow unsigned release-manifest.json on workflow_dispatch dry_run only (ignored for scheduled or published nightly runs)"

permissions:
  contents: read

concurrency:
  group: nightly-rust
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check Main Commits & Resolve Nightly Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.meta.outputs.should_build }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      git_sha: ${{ steps.meta.outputs.git_sha }}
      published_at: ${{ steps.meta.outputs.published_at }}
      changelog_summary: ${{ steps.meta.outputs.changelog_summary }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check for new commits since last nightly release
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ inputs.force == true }}
          INPUT_DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          DATE_STAMP="$(date -u +%Y%m%d)"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN="true"
          else
            DRY_RUN="false"
          fi

          RAW_VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          RAW_VER="${RAW_VER:-0.2.0}"
          NO_BUILD="${RAW_VER%%+*}"
          BASE_VER="${NO_BUILD%%-*}"
          if ! [[ "$BASE_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Cargo.toml version: ${RAW_VER} (expected X.Y.Z[-prerelease])" >&2
            exit 1
          fi
          if [ "$NO_BUILD" = "$BASE_VER" ]; then
            # Cargo.toml is a stable release (e.g. 0.2.0): bump patch so 0.2.1-nightly.*
            # sorts strictly newer than stable 0.2.0 under SemVer anti-rollback protection
            # while still sorting older than the eventual stable 0.2.1 release.
            IFS=. read -r V_MAJOR V_MINOR V_PATCH <<< "$BASE_VER"
            NIGHTLY_BASE="${V_MAJOR}.${V_MINOR}.$((V_PATCH + 1))"
          else
            NIGHTLY_BASE="${BASE_VER}"
          fi
          # Existing clients compare the whole prerelease string lexically. Keep the run
          # number fixed-width, with a letter so leading zeros are valid SemVer.
          # "run" sorts after all legacy hexadecimal SHA identifiers on the same day.
          printf -v RUN_ID 'r%020d' "$GITHUB_RUN_NUMBER"
          NIGHTLY_VER="${NIGHTLY_BASE}-nightly.${DATE_STAMP}.run.${RUN_ID}.g${SHORT_SHA}"

          LAST_SHA=""
          if LAST_TAG_JSON="$(gh api "repos/${REPO}/git/ref/tags/nightly" 2>/dev/null || true)"; then
            if [ -n "$LAST_TAG_JSON" ]; then
              LAST_SHA="$(node -e '
                const data = JSON.parse(process.argv[1]);
                process.stdout.write((data.object && data.object.sha) ? String(data.object.sha) : "");
              ' "$LAST_TAG_JSON" 2>/dev/null || true)"
            fi
          fi

          SHOULD_BUILD="true"
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$HEAD_SHA" ] && [ "$FORCE_BUILD" != "true" ] && [ "$DRY_RUN" != "true" ]; then
            SHOULD_BUILD="false"
            echo "No new commits on main since last nightly release (${HEAD_SHA}); skipping nightly build."
          else
            echo "Building nightly release ${NIGHTLY_VER} for commit ${HEAD_SHA} (previous nightly: ${LAST_SHA:-none}, dry_run=${DRY_RUN})."
          fi

          SUMMARY="$(git log -1 --pretty=%s | tr '\r\n' ' ' | cut -c1-160)"

          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "tag=nightly" >> "$GITHUB_OUTPUT"
          echo "version=${NIGHTLY_VER}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "published_at=${PUBLISHED_AT}" >> "$GITHUB_OUTPUT"
          echo "changelog_summary=${SUMMARY}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    uses: ./.github/workflows/build-rust-archives.yml
    with:
      git_sha: ${{ needs.prepare.outputs.git_sha }}
      tag: ${{ needs.prepare.outputs.tag }}
      artifact_prefix: nightly
      nightly_version: ${{ needs.prepare.outputs.version }}

  release:
    name: Generate Checksums, Signed Manifest & Update Rolling Nightly Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout nightly commit (with tag history for change-aware plugin manifest)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.git_sha }}
          fetch-depth: 0

      - name: Download all 6 nightly target archives
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          merge-multiple: true
          path: dist

      - name: Package official non-Rust plugins archive & detect changed plugins
        id: plugins
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/pack-plugins.mjs \
            --tag "${TAG}" \
            --out-dir dist \
            --notes-out dist/changed-plugins.md \
            --github-output "${GITHUB_OUTPUT}"
          ls -lh "dist/hyp-${TAG}-plugins.tar.gz" dist/plugins-manifest.json
          cat dist/changed-plugins.md

      - name: Generate SHA256SUMS.txt & canonical release-manifest.json
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
          PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
          CHANGELOG_SUMMARY: ${{ needs.prepare.outputs.changelog_summary }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          ALLOW_UNSIGNED_DRY_RUN: ${{ inputs.allow_unsigned_dry_run || false }}
          HYPHAE_RELEASE_SIGNING_KEY: ${{ secrets.HYPHAE_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cd dist

          expected=(
            "hyp-${TAG}-aarch64-apple-darwin.tar.gz"
            "hyp-${TAG}-x86_64-apple-darwin.tar.gz"
            "hyp-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "hyp-${TAG}-x86_64-unknown-linux-musl.tar.gz"
            "hyp-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
            "hyp-${TAG}-x86_64-pc-windows-msvc.zip"
            "hyp-${TAG}-plugins.tar.gz"
          )

          for file in "${expected[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing expected nightly archive: $file" >&2
              exit 1
            fi
          done

          sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

          node <<'EOF'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const tag = process.env.TAG;
          const repo = process.env.REPO;
          const isWorkflowDispatch = process.env.EVENT_NAME === "workflow_dispatch";
          const isDryRun = process.env.DRY_RUN === "true";
          const allowUnsignedDryRun = process.env.ALLOW_UNSIGNED_DRY_RUN === "true";
          const targets = [
            ["aarch64-apple-darwin", "tar.gz"],
            ["aarch64-unknown-linux-gnu", "tar.gz"],
            ["plugins", "tar.gz"],
            ["x86_64-apple-darwin", "tar.gz"],
            ["x86_64-pc-windows-msvc", "zip"],
            ["x86_64-unknown-linux-gnu", "tar.gz"],
            ["x86_64-unknown-linux-musl", "tar.gz"],
          ];

          const artifacts = {};
          for (const [triple, ext] of targets) {
            const filename = `hyp-${tag}-${triple}.${ext}`;
            const data = fs.readFileSync(filename);
            const sha256 = crypto.createHash("sha256").update(data).digest("hex");
            artifacts[triple] = {
              sha256,
              size: data.length,
              url: `https://github.com/${repo}/releases/download/${tag}/${filename}`,
            };
          }

          function canonicalize(value) {
            if (value === null || typeof value !== "object") {
              return JSON.stringify(value);
            }
            if (Array.isArray(value)) {
              return "[" + value.map(canonicalize).join(",") + "]";
            }
            const keys = Object.keys(value).sort();
            return "{" + keys.map((k) => JSON.stringify(k) + ":" + canonicalize(value[k])).join(",") + "}";
          }

          const payloadObj = {
            artifacts,
            changelogSummary: process.env.CHANGELOG_SUMMARY || "Automated nightly build from main",
            channel: "nightly",
            gitSha: process.env.GIT_SHA,
            minProtocol: 1,
            publishedAt: process.env.PUBLISHED_AT,
            version: process.env.VERSION,
          };
          const canonicalPayload = canonicalize(payloadObj);

          let sig = "";
          const rawKey = (process.env.HYPHAE_RELEASE_SIGNING_KEY || "").trim();
          if (rawKey) {
            const keyObj = rawKey.includes("BEGIN PRIVATE KEY")
              ? crypto.createPrivateKey(rawKey)
              : crypto.createPrivateKey({
                  key: Buffer.from(rawKey, "base64url"),
                  format: "der",
                  type: "pkcs8",
                });
            const signingInput = Buffer.concat([
              Buffer.from("hyphae/v2/release\n", "utf8"),
              Buffer.from(canonicalPayload, "utf8"),
            ]);
            sig = crypto.sign(null, signingInput, keyObj).toString("base64url");
            console.log("Signed release-manifest.json with HYPHAE_RELEASE_SIGNING_KEY.");
          } else if (isWorkflowDispatch && isDryRun && allowUnsignedDryRun) {
            console.warn(
              "WARNING: HYPHAE_RELEASE_SIGNING_KEY not configured; writing unsigned manifest envelope for explicitly opted-in workflow_dispatch dry-run."
            );
          } else {
            console.error(
              "ERROR: HYPHAE_RELEASE_SIGNING_KEY secret is required (fail-closed); refusing to publish an unsigned nightly release-manifest.json."
            );
            process.exit(1);
          }

          const envelope = { payload: canonicalPayload, sig };
          fs.writeFileSync("release-manifest.json", JSON.stringify(envelope, null, 2) + "\n", "utf8");
          EOF

      - name: Verify release-manifest.json signature against pinned public key
        if: github.event_name != 'workflow_dispatch' || !(needs.prepare.outputs.dry_run == 'true' && inputs.allow_unsigned_dry_run == true)
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const updateRs = fs.readFileSync("crates/hyp-cli/src/update.rs", "utf8");
          const match = updateRs.match(/pub const DEFAULT_RELEASE_PUBKEY_B64:\s*&str\s*=\s*"([A-Za-z0-9_-]{43})";/);
          if (!match) {
            console.error("ERROR: Could not extract DEFAULT_RELEASE_PUBKEY_B64 from crates/hyp-cli/src/update.rs");
            process.exit(1);
          }
          const rawPub = Buffer.from(match[1], "base64url");
          if (rawPub.length !== 32) {
            console.error(`ERROR: Expected 32-byte Ed25519 public key, got ${rawPub.length}`);
            process.exit(1);
          }
          const spkiPrefix = Buffer.from("302a300506032b6570032100", "hex");
          const pubKeyObj = crypto.createPublicKey({
            key: Buffer.concat([spkiPrefix, rawPub]),
            format: "der",
            type: "spki",
          });

          const envelope = JSON.parse(fs.readFileSync("dist/release-manifest.json", "utf8"));
          if (!envelope || typeof envelope.payload !== "string" || typeof envelope.sig !== "string" || !envelope.sig.trim()) {
            console.error("ERROR: dist/release-manifest.json is missing payload or signature");
            process.exit(1);
          }
          const signingInput = Buffer.concat([
            Buffer.from("hyphae/v2/release\n", "utf8"),
            Buffer.from(envelope.payload, "utf8"),
          ]);
          const ok = crypto.verify(null, signingInput, pubKeyObj, Buffer.from(envelope.sig, "base64url"));
          if (!ok) {
            console.error("ERROR: release-manifest.json signature failed verification against DEFAULT_RELEASE_PUBKEY_B64 in crates/hyp-cli/src/update.rs");
            process.exit(1);
          }
          console.log("Verified dist/release-manifest.json signature against pinned DEFAULT_RELEASE_PUBKEY_B64.");
          EOF

      - name: Upload dry-run nightly bundle (workflow_dispatch)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hyphae-rust-nightly-${{ needs.prepare.outputs.version }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - name: Move rolling nightly tag to built commit
        if: needs.prepare.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/nightly" \
              -f sha="${GIT_SHA}" \
              -F force=true >/dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/tags/nightly" \
              -f sha="${GIT_SHA}" >/dev/null
          fi

      - name: Compose nightly release notes
        if: needs.prepare.outputs.dry_run != 'true'
        shell: bash
        env:
          GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
          CHANGELOG_SUMMARY: ${{ needs.prepare.outputs.changelog_summary }}
        run: |
          set -euo pipefail
          {
            echo "Rolling nightly Rust build from \`main\` commit \`${GIT_SHA}\`."
            echo ""
            echo "- **Version:** \`${VERSION}\`"
            echo "- **Published:** \`${PUBLISHED_AT}\`"
            echo "- **Summary:** ${CHANGELOG_SUMMARY}"
            echo ""
            cat dist/changed-plugins.md
          } > dist/nightly-release-notes.md

      - name: Update rolling nightly GitHub Release
        if: needs.prepare.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ needs.prepare.outputs.git_sha }}
          name: "Hyphae Nightly (${{ needs.prepare.outputs.version }})"
          body_path: dist/nightly-release-notes.md
          prerelease: true
          make_latest: "false"
          files: |
            dist/hyp-*
            dist/SHA256SUMS.txt
            dist/plugins-manifest.json
            dist/release-manifest.json
