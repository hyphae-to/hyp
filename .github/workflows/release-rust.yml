name: Release Rust Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ""
        description: "Optional version tag for dry-run build (e.g. v0.2.0-dryrun); never publishes a GitHub Release on workflow_dispatch"
      allow_unsigned_dry_run:
        type: boolean
        required: false
        default: false
        description: "Allow unsigned release-manifest.json on non-tag workflow_dispatch dry-runs only (ignored for v* tag releases)"

permissions:
  contents: read

concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      git_sha: ${{ steps.meta.outputs.git_sha }}
      published_at: ${{ steps.meta.outputs.published_at }}
      changelog_summary: ${{ steps.meta.outputs.changelog_summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag & mode
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY_RUN="true"
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
            else
              VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
              TAG="v${VER:-0.2.0-dryrun}"
            fi
          else
            DRY_RUN="false"
            TAG="$REF_NAME"
          fi

          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "Invalid release tag: $TAG (expected vX.Y.Z...)" >&2
            exit 1
          fi

          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          VERSION="${TAG#v}"
          GIT_SHA="$(git rev-parse HEAD)"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SUMMARY="$(git log -1 --pretty=%s | tr '\r\n' ' ' | cut -c1-160)"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GIT_SHA" >> "$GITHUB_OUTPUT"
          echo "published_at=$PUBLISHED_AT" >> "$GITHUB_OUTPUT"
          echo "changelog_summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "Resolved Rust release parameters: tag=$TAG version=$VERSION dry_run=$DRY_RUN prerelease=$PRERELEASE sha=$GIT_SHA"

  build:
    name: Build (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64-and-x64
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            os: macos-latest
            smoke_target: aarch64-apple-darwin
          - label: x86_64-unknown-linux-gnu
            targets: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            smoke_target: x86_64-unknown-linux-gnu
          - label: x86_64-unknown-linux-musl
            targets: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
            smoke_target: x86_64-unknown-linux-musl
          - label: aarch64-unknown-linux-gnu
            targets: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            smoke_target: aarch64-unknown-linux-gnu
          - label: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
            os: windows-latest
            smoke_target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.87.0 (${{ matrix.targets }})
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: ${{ matrix.targets }}

      - name: Rust cache (shared with nightly per builder)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.label }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install musl-tools (for x86_64-unknown-linux-musl)
        if: matrix.musl == true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build stripped release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          IFS=',' read -ra TRIPLE_LIST <<< "$TARGETS"
          for TARGET in "${TRIPLE_LIST[@]}"; do
            echo "=== Building ${TARGET} ==="
            cargo build --release --locked --target "$TARGET" -p hyp-cli
          done

      - name: Build stripped release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.targets }}
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --locked --target $env:TARGET -p hyp-cli

      - name: Package archive (Unix tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGETS: ${{ matrix.targets }}
          SMOKE_TARGET: ${{ matrix.smoke_target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          IFS=',' read -ra TRIPLE_LIST <<< "$TARGETS"
          for TARGET in "${TRIPLE_LIST[@]}"; do
            ARCHIVE="hyp-${TAG}-${TARGET}.tar.gz"
            STAGE="$(mktemp -d)"

            cp "target/${TARGET}/release/hyp" "${STAGE}/hyp"
            chmod 0755 "${STAGE}/hyp"

            if [ "$TARGET" = "$SMOKE_TARGET" ]; then
              out="$("${STAGE}/hyp" version --json)"
              echo "$out"
              python3 -c 'import json, sys; j = json.loads(sys.argv[1]); assert j.get("ok") is True and j.get("command") == "version" and j.get("data", {}).get("version"), j' "$out"
            fi

            tar -C "$STAGE" -czf "dist/${ARCHIVE}" hyp
            rm -rf "$STAGE"
            ls -lh "dist/${ARCHIVE}"
          done

      - name: Package archive (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.targets }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "hyp-$($env:TAG)-$($env:TARGET).zip"
          $stage = Join-Path $env:RUNNER_TEMP "hyp-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $bin = Join-Path $stage "hyp.exe"
          Copy-Item -Path "target\$($env:TARGET)\release\hyp.exe" -Destination $bin -Force
          $out = & $bin version --json
          Write-Output $out
          $json = $out | ConvertFrom-Json
          if (-not $json.ok -or $json.command -ne "version" -or -not $json.data.version) {
            throw "Unexpected hyp.exe version --json output: $out"
          }

          Compress-Archive -Path $bin -DestinationPath "dist\$archive" -Force
          Get-Item "dist\$archive" | Format-List Name, Length

      - name: Upload target archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: dist/hyp-*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Generate Checksums, Signed Manifest & Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release commit (with tag history for change-aware plugin manifest)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.git_sha }}
          fetch-depth: 0

      - name: Download all target archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Package official non-Rust plugins archive & detect changed plugins
        id: plugins
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/pack-plugins.mjs \
            --tag "${TAG}" \
            --out-dir dist \
            --notes-out dist/changed-plugins.md \
            --github-output "${GITHUB_OUTPUT}"
          ls -lh "dist/hyp-${TAG}-plugins.tar.gz" dist/plugins-manifest.json
          cat dist/changed-plugins.md

      - name: Generate and verify SHA256SUMS.txt & canonical release-manifest.json
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
          PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
          CHANGELOG_SUMMARY: ${{ needs.prepare.outputs.changelog_summary }}
          REPO: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          ALLOW_UNSIGNED_DRY_RUN: ${{ inputs.allow_unsigned_dry_run || false }}
          HYPHAE_RELEASE_SIGNING_KEY: ${{ secrets.HYPHAE_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cd dist

          expected=(
            "hyp-${TAG}-aarch64-apple-darwin.tar.gz"
            "hyp-${TAG}-x86_64-apple-darwin.tar.gz"
            "hyp-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "hyp-${TAG}-x86_64-unknown-linux-musl.tar.gz"
            "hyp-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
            "hyp-${TAG}-x86_64-pc-windows-msvc.zip"
            "hyp-${TAG}-plugins.tar.gz"
          )

          for file in "${expected[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing expected release archive: $file" >&2
              exit 1
            fi
          done

          sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          echo "=== Verifying checksums ==="
          sha256sum -c SHA256SUMS.txt

          node <<'EOF'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const tag = process.env.TAG;
          const repo = process.env.REPO;
          const githubRef = process.env.GITHUB_REF || "";
          const isTagRelease = githubRef.startsWith("refs/tags/v");
          const isDryRun = process.env.DRY_RUN === "true";
          const allowUnsignedDryRun = process.env.ALLOW_UNSIGNED_DRY_RUN === "true";

          const targets = [
            ["aarch64-apple-darwin", "tar.gz"],
            ["aarch64-unknown-linux-gnu", "tar.gz"],
            ["plugins", "tar.gz"],
            ["x86_64-apple-darwin", "tar.gz"],
            ["x86_64-pc-windows-msvc", "zip"],
            ["x86_64-unknown-linux-gnu", "tar.gz"],
            ["x86_64-unknown-linux-musl", "tar.gz"],
          ];

          const artifacts = {};
          for (const [triple, ext] of targets) {
            const filename = `hyp-${tag}-${triple}.${ext}`;
            const data = fs.readFileSync(filename);
            const sha256 = crypto.createHash("sha256").update(data).digest("hex");
            artifacts[triple] = {
              sha256,
              size: data.length,
              url: `https://github.com/${repo}/releases/download/${tag}/${filename}`,
            };
          }

          function canonicalize(value) {
            if (value === null || typeof value !== "object") {
              return JSON.stringify(value);
            }
            if (Array.isArray(value)) {
              return "[" + value.map(canonicalize).join(",") + "]";
            }
            const keys = Object.keys(value).sort();
            return "{" + keys.map((k) => JSON.stringify(k) + ":" + canonicalize(value[k])).join(",") + "}";
          }

          const payloadObj = {
            artifacts,
            changelogSummary: process.env.CHANGELOG_SUMMARY || `Hyphae ${tag}`,
            channel: "stable",
            gitSha: process.env.GIT_SHA,
            minProtocol: 1,
            publishedAt: process.env.PUBLISHED_AT,
            version: process.env.VERSION,
          };
          const canonicalPayload = canonicalize(payloadObj);

          let sig = "";
          const rawKey = (process.env.HYPHAE_RELEASE_SIGNING_KEY || "").trim();
          if (rawKey) {
            const keyObj = rawKey.includes("BEGIN PRIVATE KEY")
              ? crypto.createPrivateKey(rawKey)
              : crypto.createPrivateKey({
                  key: Buffer.from(rawKey, "base64url"),
                  format: "der",
                  type: "pkcs8",
                });
            const signingInput = Buffer.concat([
              Buffer.from("hyphae/v2/release\n", "utf8"),
              Buffer.from(canonicalPayload, "utf8"),
            ]);
            sig = crypto.sign(null, signingInput, keyObj).toString("base64url");
            console.log("Signed release-manifest.json with HYPHAE_RELEASE_SIGNING_KEY.");
          } else if (!isTagRelease && isDryRun && allowUnsignedDryRun) {
            console.warn(
              "WARNING: HYPHAE_RELEASE_SIGNING_KEY not configured; writing unsigned manifest envelope for explicitly opted-in workflow_dispatch dry-run."
            );
          } else {
            console.error(
              "ERROR: HYPHAE_RELEASE_SIGNING_KEY secret is required (fail-closed); refusing to publish an unsigned release-manifest.json."
            );
            process.exit(1);
          }

          const envelope = { payload: canonicalPayload, sig };
          fs.writeFileSync("release-manifest.json", JSON.stringify(envelope, null, 2) + "\n", "utf8");
          EOF

      - name: Verify release-manifest.json signature against pinned public key
        if: startsWith(github.ref, 'refs/tags/v') || !(needs.prepare.outputs.dry_run == 'true' && inputs.allow_unsigned_dry_run == true)
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const updateRs = fs.readFileSync("crates/hyp-cli/src/update.rs", "utf8");
          const match = updateRs.match(/pub const DEFAULT_RELEASE_PUBKEY_B64:\s*&str\s*=\s*"([A-Za-z0-9_-]{43})";/);
          if (!match) {
            console.error("ERROR: Could not extract DEFAULT_RELEASE_PUBKEY_B64 from crates/hyp-cli/src/update.rs");
            process.exit(1);
          }
          const rawPub = Buffer.from(match[1], "base64url");
          if (rawPub.length !== 32) {
            console.error(`ERROR: Expected 32-byte Ed25519 public key, got ${rawPub.length}`);
            process.exit(1);
          }
          const spkiPrefix = Buffer.from("302a300506032b6570032100", "hex");
          const pubKeyObj = crypto.createPublicKey({
            key: Buffer.concat([spkiPrefix, rawPub]),
            format: "der",
            type: "spki",
          });

          const envelope = JSON.parse(fs.readFileSync("dist/release-manifest.json", "utf8"));
          if (!envelope || typeof envelope.payload !== "string" || typeof envelope.sig !== "string" || !envelope.sig.trim()) {
            console.error("ERROR: dist/release-manifest.json is missing payload or signature");
            process.exit(1);
          }
          const signingInput = Buffer.concat([
            Buffer.from("hyphae/v2/release\n", "utf8"),
            Buffer.from(envelope.payload, "utf8"),
          ]);
          const ok = crypto.verify(null, signingInput, pubKeyObj, Buffer.from(envelope.sig, "base64url"));
          if (!ok) {
            console.error("ERROR: release-manifest.json signature failed verification against DEFAULT_RELEASE_PUBKEY_B64 in crates/hyp-cli/src/update.rs");
            process.exit(1);
          }
          console.log("Verified dist/release-manifest.json signature against pinned DEFAULT_RELEASE_PUBKEY_B64.");
          EOF

      - name: Upload dry-run release bundle (workflow_dispatch)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hyphae-rust-release-${{ needs.prepare.outputs.tag }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Tag Claude Code plugin release (only when claude-code treeSha256 changed)
        if: needs.prepare.outputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/v') && steps.plugins.outputs.changed_claude_code == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
        run: |
          set -euo pipefail
          PLUGIN_TAG="hyphae--${TAG}"
          if gh api "repos/${REPO}/git/ref/tags/${PLUGIN_TAG}" >/dev/null 2>&1; then
            echo "Claude Code plugin tag ${PLUGIN_TAG} already exists; skipping."
          else
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/tags/${PLUGIN_TAG}" \
              -f sha="${GIT_SHA}" >/dev/null
            echo "Created Claude Code plugin tag ${PLUGIN_TAG} at ${GIT_SHA}."
          fi

      - name: Upload archives, SHA256SUMS.txt, plugins-manifest.json & release-manifest.json to GitHub Release
        if: needs.prepare.outputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Hyphae ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          body_path: dist/changed-plugins.md
          generate_release_notes: true
          files: |
            dist/hyp-*
            dist/SHA256SUMS.txt
            dist/plugins-manifest.json
            dist/release-manifest.json
