name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  HYPHAE_SECRET_BACKEND: file

jobs:
  rust-workspace:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.87.0
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy (zero warnings across workspace & all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Tests (unit, golden interop, chaos & CLI E2E)
        run: cargo test --workspace

      - name: Build release binary (hyp)
        run: cargo build --release -p hyp-cli

      - name: Smoke-test compiled binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="$(./target/release/hyp version --json)"
          echo "$out"
          python3 -c 'import json, sys; j = json.loads(sys.argv[1]); assert j.get("ok") is True and j.get("command") == "version" and j.get("data", {}).get("version"), j' "$out"

      - name: Smoke-test compiled binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = & .\target\release\hyp.exe version --json
          Write-Output $out
          $json = $out | ConvertFrom-Json
          if (-not $json.ok -or $json.command -ne "version" -or -not $json.data.version) {
            throw "Unexpected hyp.exe version --json output: $out"
          }

      - name: Syntax-check Windows PowerShell installer & mirror parity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @("scripts/install.ps1", "site/install.ps1")) {
            $tokens = $null
            $errors = $null
            $resolved = (Resolve-Path $path).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($resolved, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $msg = ($errors | ForEach-Object { $_.ToString() }) -join "`n"
              throw "PowerShell syntax error(s) in ${path}:`n$msg"
            }
          }
          $a = [System.IO.File]::ReadAllBytes((Resolve-Path "scripts/install.ps1").Path)
          $b = [System.IO.File]::ReadAllBytes((Resolve-Path "site/install.ps1").Path)
          if ($a.Length -ne $b.Length) {
            throw "scripts/install.ps1 and site/install.ps1 differ in length ($($a.Length) vs $($b.Length))."
          }
          for ($i = 0; $i -lt $a.Length; $i++) {
            if ($a[$i] -ne $b[$i]) {
              throw "scripts/install.ps1 and site/install.ps1 differ at byte offset $i."
            }
          }
          Write-Host "PowerShell AST parse & byte-identical mirror parity verified."

  installer-test:
    name: Installer Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.87.0
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Prefetch Cargo dependencies for offline installer test
        run: cargo fetch --locked

      - name: Run installer end-to-end verification suite
        shell: bash
        run: bash scripts/test-installer.sh

  site-and-plugins:
    name: Site & External Plugins (Syntax + Live E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check site script, external JS/Python plugins, and installer mirrors
        shell: bash
        run: |
          set -euo pipefail
          node --check site/app.js
          while IFS= read -r file; do
            node --check "$file"
          done < <(find plugins -type f -name '*.mjs' | sort)
          python3 -m py_compile plugins/sdk/client.py
          sh -n install.sh scripts/install.sh site/install.sh
          cmp -s scripts/install.sh site/install.sh
          cmp -s scripts/install.sh install.sh
          cmp -s scripts/install.ps1 site/install.ps1

      - name: Install Rust 1.87.0
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run live Node.js & Python external plugin E2E suite
        run: cargo test -p hyp-node --test real_plugins_e2e
