name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      os:
        description: "Target OS matrix (pick a single OS for fast branch checks without burning full 3-OS minutes)"
        type: choice
        default: all
        options:
          - all
          - windows-latest
          - macos-latest
          - ubuntu-latest
      skip_release_build:
        description: "Skip release binary build & installer checks (fast clippy + workspace tests only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HYPHAE_SECRET_BACKEND: file

jobs:
  lint-site-and-plugins:
    name: Lint, Parity & Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_rust: ${{ steps.changes.outputs.run_rust }}
      os_matrix: ${{ steps.changes.outputs.os_matrix }}
      skip_release_build: ${{ steps.changes.outputs.skip_release_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check site script, external JS/Python plugins, installers, and mirror parity
        shell: bash
        run: |
          set -euo pipefail
          node --version
          python3 --version

          node --check site/app.js
          node --check site/drop/crypto.js
          node --check site/drop/drop.js
          node scripts/test-drop-crypto.mjs
          node --check scripts/pack-plugins.mjs
          node --check workers/drop-relay/src/index.mjs
          node workers/drop-relay/test/worker.test.mjs
          while IFS= read -r file; do
            node --check "$file"
          done < <(find plugins -type f \( -name '*.mjs' -o -name '*.js' \) | sort)
          node plugins/herdr-mod/test/mod.test.mjs
          node --test plugins/test/sources.test.mjs

          while IFS= read -r file; do
            python3 -m py_compile "$file"
          done < <(find plugins -type f -name '*.py' | sort)

          sh -n install.sh scripts/install.sh site/install.sh uninstall.sh scripts/uninstall.sh site/uninstall.sh plugins/herdr-mod/scripts/install.sh
          bash -n scripts/test-installer.sh scripts/uninstall.sh scripts/reset-local.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -s sh scripts/install.sh
          fi

          cmp -s scripts/install.sh site/install.sh
          cmp -s scripts/install.sh install.sh
          cmp -s scripts/install.ps1 site/install.ps1
          cmp -s scripts/uninstall.sh site/uninstall.sh
          cmp -s scripts/uninstall.sh uninstall.sh
          cmp -s scripts/uninstall.ps1 site/uninstall.ps1

          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '
              $ErrorActionPreference = "Stop"
              foreach ($path in @("scripts/install.ps1", "site/install.ps1", "scripts/uninstall.ps1", "site/uninstall.ps1")) {
                $tokens = $null
                $errors = $null
                $resolved = (Resolve-Path $path).Path
                [void][System.Management.Automation.Language.Parser]::ParseFile($resolved, [ref]$tokens, [ref]$errors)
                if ($errors -and $errors.Count -gt 0) {
                  $msg = ($errors | ForEach-Object { $_.ToString() }) -join "`n"
                  throw "PowerShell syntax error(s) in ${path}:`n$msg"
                }
              }
            '
          fi
          echo "All site, plugin, shell, PowerShell, and installer mirror checks passed."

      - name: Detect whether Rust workspace CI is required
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          INPUT_OS: ${{ inputs.os }}
          INPUT_SKIP_RELEASE_BUILD: ${{ inputs.skip_release_build }}
        run: |
          set -euo pipefail
          ALL_OS='["ubuntu-latest","macos-latest","windows-latest"]'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "${INPUT_OS:-all}" in
              ubuntu-latest|macos-latest|windows-latest)
                OS_MATRIX="[\"${INPUT_OS}\"]"
                ;;
              *)
                OS_MATRIX="$ALL_OS"
                ;;
            esac
            SKIP_REL="${INPUT_SKIP_RELEASE_BUILD:-false}"
            echo "workflow_dispatch: running Rust CI for os_matrix=${OS_MATRIX} (skip_release_build=${SKIP_REL})."
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
            echo "os_matrix=${OS_MATRIX}" >> "$GITHUB_OUTPUT"
            echo "skip_release_build=${SKIP_REL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "os_matrix=${ALL_OS}" >> "$GITHUB_OUTPUT"
          echo "skip_release_build=false" >> "$GITHUB_OUTPUT"

          CHANGED=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
              CHANGED="$(git -c core.quotepath=false diff --name-only HEAD^1 HEAD || true)"
            elif [ -n "${PR_BASE_SHA:-}" ] && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
              CHANGED="$(git -c core.quotepath=false diff --name-only "${PR_BASE_SHA}" HEAD || true)"
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "${PUSH_BEFORE_SHA:-}" ] \
              && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
              CHANGED="$(git -c core.quotepath=false diff --name-only "${PUSH_BEFORE_SHA}" "${GITHUB_SHA}" || true)"
            fi
          fi

          if [ -z "$CHANGED" ]; then
            echo "Unable to narrow changed files (initial/force push or empty diff); running Rust CI (fail-safe)."
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_RUST="false"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              *.md|LICENSE|docs/*|skills/*|site/index.html|site/styles.css|site/app.js|site/CNAME|site/assets/*|.github/workflows/pages.yml)
                ;;
              *)
                echo "Code/runtime/plugin/installer/workflow change detected: $path"
                RUN_RUST="true"
                break
                ;;
            esac
          done <<< "$CHANGED"

          if [ "$RUN_RUST" = "false" ]; then
            echo "Only docs/static-site files changed; skipping 3-OS Rust workspace build."
          fi
          echo "run_rust=${RUN_RUST}" >> "$GITHUB_OUTPUT"

  rust-workspace:
    name: Rust (${{ matrix.os }})
    needs: lint-site-and-plugins
    if: needs.lint-site-and-plugins.outputs.run_rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.lint-site-and-plugins.outputs.os_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.87.0
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy (zero warnings across workspace & all targets)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace Tests (unit, golden interop, chaos & CLI E2E)
        run: cargo test --workspace --locked

      - name: Verify live Node.js & Python external plugin E2E (zero skips)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          python3 --version
          out="$(cargo test --locked -p hyp-node --test real_plugins_e2e -- --nocapture 2>&1)"
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q 'SKIP '; then
            echo "ERROR: real_plugins_e2e skipped one or more live plugin tests!" >&2
            exit 1
          fi

      - name: Verify bidirectional JS <-> Rust Verified Human Drops interop (H19)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          cargo build -p hyp-cli --locked
          node --test site/drop/cross_lang_interop.test.mjs

      - name: Build release binary (hyp)
        if: needs.lint-site-and-plugins.outputs.skip_release_build != 'true'
        run: cargo build --release --locked -p hyp-cli

      - name: Smoke-test compiled binary (Unix)
        if: runner.os != 'Windows' && needs.lint-site-and-plugins.outputs.skip_release_build != 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="$(./target/release/hyp version --json)"
          echo "$out"
          python3 -c 'import json, sys; j = json.loads(sys.argv[1]); assert j.get("ok") is True and j.get("command") == "version" and j.get("data", {}).get("version"), j' "$out"

      - name: Run installer E2E verification suite (Unix, reusing built binary)
        if: runner.os != 'Windows' && needs.lint-site-and-plugins.outputs.skip_release_build != 'true'
        shell: bash
        env:
          HYPHAE_PREBUILT_BIN: ./target/release/hyp
        run: bash scripts/test-installer.sh

      - name: Smoke-test compiled binary (Windows)
        if: runner.os == 'Windows' && needs.lint-site-and-plugins.outputs.skip_release_build != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = & .\target\release\hyp.exe version --json
          Write-Output $out
          $json = $out | ConvertFrom-Json
          if (-not $json.ok -or $json.command -ne "version" -or -not $json.data.version) {
            throw "Unexpected hyp.exe version --json output: $out"
          }

      - name: Verify Windows PowerShell installer & uninstaller (AST, parity & dry-run)
        if: runner.os == 'Windows' && needs.lint-site-and-plugins.outputs.skip_release_build != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @("scripts/install.ps1", "site/install.ps1", "scripts/uninstall.ps1", "site/uninstall.ps1")) {
            $tokens = $null
            $errors = $null
            $resolved = (Resolve-Path $path).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($resolved, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $msg = ($errors | ForEach-Object { $_.ToString() }) -join "`n"
              throw "PowerShell syntax error(s) in ${path}:`n$msg"
            }
          }
          foreach ($pair in @(
            @("scripts/install.ps1", "site/install.ps1"),
            @("scripts/uninstall.ps1", "site/uninstall.ps1")
          )) {
            $a = [System.IO.File]::ReadAllBytes((Resolve-Path $pair[0]).Path)
            $b = [System.IO.File]::ReadAllBytes((Resolve-Path $pair[1]).Path)
            if ($a.Length -ne $b.Length) {
              throw "$($pair[0]) and $($pair[1]) differ in length ($($a.Length) vs $($b.Length))."
            }
            for ($i = 0; $i -lt $a.Length; $i++) {
              if ($a[$i] -ne $b[$i]) {
                throw "$($pair[0]) and $($pair[1]) differ at byte offset $i."
              }
            }
          }
          $dryOut = (& .\scripts\install.ps1 -Version v0.2.0-test -BaseUrl "http://127.0.0.1:1/test" -DryRun) | Out-String
          Write-Output $dryOut
          if ($dryOut -notmatch "hyp-v0\.2\.0-test-x86_64-pc-windows-msvc\.zip") {
            throw "Unexpected Windows installer -DryRun output: $dryOut"
          }
          $tmpRoot = Join-Path ([System.IO.Path]::GetTempPath()) ("hyphae-ps1-ci-" + [System.Guid]::NewGuid().ToString("N"))
          $tmpBin = Join-Path $tmpRoot "bin"
          $tmpState = Join-Path $tmpRoot "state"
          try {
            New-Item -ItemType Directory -Force -Path $tmpBin, $tmpState | Out-Null
            Set-Content -LiteralPath (Join-Path $tmpBin "hyp.exe") -Value "stub" -NoNewline
            Set-Content -LiteralPath (Join-Path $tmpBin "hyp.exe.old") -Value "old" -NoNewline
            Set-Content -LiteralPath (Join-Path $tmpState "node.json") -Value "{}" -NoNewline
            $uDry = (& .\scripts\uninstall.ps1 -DryRun -InstallDir $tmpBin -StateDir $tmpState -KeepHarnesses) | Out-String
            Write-Output $uDry
            if ($uDry -notmatch "\[dry-run\]") {
              throw "Unexpected Windows uninstaller -DryRun output: $uDry"
            }
            if (-not (Test-Path -LiteralPath (Join-Path $tmpBin "hyp.exe")) -or -not (Test-Path -LiteralPath (Join-Path $tmpState "node.json"))) {
              throw "Windows uninstaller -DryRun modified files!"
            }
            $prevEap = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            & pwsh -NoProfile -File .\scripts\uninstall.ps1 -InstallDir $tmpBin -StateDir $tmpState -KeepHarnesses
            $nonInteractiveRc = $LASTEXITCODE
            $ErrorActionPreference = $prevEap
            if ($nonInteractiveRc -ne 2) {
              throw "Expected non-interactive uninstall.ps1 without -Yes to exit 2, got $nonInteractiveRc"
            }
            & pwsh -NoProfile -File .\scripts\uninstall.ps1 -Yes -InstallDir $tmpBin -StateDir $tmpState -KeepHarnesses
            if ($LASTEXITCODE -ne 0) {
              throw "Expected uninstall.ps1 -Yes to exit 0, got $LASTEXITCODE"
            }
            if ((Test-Path -LiteralPath $tmpBin) -or (Test-Path -LiteralPath $tmpState)) {
              throw "Windows uninstaller -Yes failed to remove isolated test targets!"
            }
          } finally {
            if (Test-Path -LiteralPath $tmpRoot) {
              Remove-Item -LiteralPath $tmpRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "PowerShell AST parse, byte-identical mirror parity, dry-run & isolated uninstall verified."
