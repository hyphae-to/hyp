name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  HYPHAE_SECRET_BACKEND: file

jobs:
  rust-workspace:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.87.0
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js 24 (for TS↔Rust differential tests)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Clippy (zero warnings across workspace & all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Tests (unit, differential & integration)
        run: cargo test --workspace

      - name: Build release binary (hyp-cli)
        run: cargo build --release -p hyp-cli

      - name: Smoke-test compiled binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="$(./target/release/hyp-rs version --json)"
          echo "$out"
          node -e 'const j = JSON.parse(process.argv[1]); if (!j.ok || j.command !== "version" || !j.data?.version) process.exit(1);' "$out"

      - name: Smoke-test compiled binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = & .\target\release\hyp-rs.exe version --json
          Write-Output $out
          $json = $out | ConvertFrom-Json
          if (-not $json.ok -or $json.command -ne "version" -or -not $json.data.version) {
            throw "Unexpected hyp-rs.exe version --json output: $out"
          }

  installer-test:
    name: Installer Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.87.0
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Prefetch Cargo dependencies for offline installer test
        run: cargo fetch --locked

      - name: Run installer end-to-end verification suite
        shell: bash
        run: bash scripts/test-installer.sh
