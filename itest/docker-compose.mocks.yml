# Optional Tier 2 Vendor Contract Emulator Stack for Hyphae (`hyp`) Black-Box Integration Tests.
#
# Tier 1 tests require ZERO Docker (all mocks run in-process on 127.0.0.1:0).
# Use this compose file strictly for optional Tier 2 vendor contract parity checks:
#   docker compose -f itest/docker-compose.mocks.yml up -d
#   docker compose -f itest/docker-compose.mocks.yml --profile full up -d
#
# Security invariant: every published port binds strictly to loopback (`127.0.0.1`).

services:
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: "no"
    ports:
      - "127.0.0.1:19093:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  tg-mock:
    image: ghcr.io/watzon/tg-mock:latest
    restart: "no"
    ports:
      - "127.0.0.1:18081:8081"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    restart: "no"
    environment:
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:18082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/isalive || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  mosquitto:
    image: eclipse-mosquitto:2.0.21
    restart: "no"
    command: ["sh", "-c", "printf 'listener 1883 0.0.0.0\\nallow_anonymous true\\n' > /tmp/m.conf && exec mosquitto -c /tmp/m.conf"]
    ports:
      - "127.0.0.1:11883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 2 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10

  stripe-mock:
    image: stripe/stripe-mock:v0.197.0
    profiles: ["full", "payments"]
    restart: "no"
    ports:
      - "127.0.0.1:12111:12111"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Authorization: Bearer sk_test_123' http://127.0.0.1:12111/v1/customers >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  prism:
    image: stoplight/prism:5.14.2
    profiles: ["full", "openapi"]
    restart: "no"
    command: ["mock", "-h", "0.0.0.0", "-p", "4010", "https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json"]
    ports:
      - "127.0.0.1:14010:4010"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4010 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  svix-server:
    image: svix/svix-server:v1.58.0
    profiles: ["full", "webhooks"]
    restart: "no"
    environment:
      SVIX_LISTEN_ADDRESS: "0.0.0.0:8071"
      SVIX_JWT_SECRET: "itest-svix-local-jwt-secret-not-for-prod"
      SVIX_QUEUE_TYPE: "memory"
      SVIX_CACHE_TYPE: "memory"
    ports:
      - "127.0.0.1:18071:8071"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8071/api/v1/health/ping/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
