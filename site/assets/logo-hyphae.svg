  <!-- Dark sepia ink casing under tendrils for crispness on dark & light backgrounds -->
  <g fill="none" stroke="#16130E" stroke-width="8.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 46 56 L 46 69 C 46 81, 37 88, 22 90"/>
    <path d="M 82 56 L 82 69 C 82 81, 91 88, 106 90"/>
