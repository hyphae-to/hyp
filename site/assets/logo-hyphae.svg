  <path d="M 110 61 C 106 73, 88 74, 82 72" fill="none" stroke="#D8C294" stroke-width="3.6" stroke-linecap="round"/>

  <!-- Mushroom cap dome: warm parchment + flat lower shade + terracotta spots -->
